<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWS AI Practitioner Study Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hub-topbar">
    <button class="menu-button" id="menuButton" type="button" aria-expanded="false" aria-controls="sidebar">Menu</button>
    <div>
      <p class="eyebrow" id="topbarEyebrow">AIF-C01 interactive study activities</p>
      <h1><a href="#/home" class="title-link" id="topbarTitle">AWS AI Practitioner Study Hub</a></h1>
    </div>
    <div class="topbar-actions">
      <div class="lang-toggle" role="group" aria-label="Language / Idioma">
        <button type="button" class="lang-btn" id="langBtnEn" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" class="lang-btn" id="langBtnEs" data-lang="es" aria-pressed="false">ES</button>
      </div>
      <button class="link-button" id="exportProgress" type="button">Export progress</button>
      <button class="link-button" id="importProgress" type="button">Import progress</button>
      <button class="link-button" id="resetProgress" type="button">Reset progress</button>
    </div>
  </header>

  <div class="hub-shell">
    <aside class="sidebar" id="sidebar" aria-label="Study navigation"></aside>
    <main class="hub-main" id="app" tabindex="-1"></main>
  </div>

  <footer class="footnote hub-footer">
    <strong id="footerOrg">AWS Student Builder Group — Antonio Varas.</strong> <span id="footerText">Built from the study guide and local study activities in this repository. This is not an official AWS product and does not use AWS logos.</span>
  </footer>

  <script src="data/domain1.js"></script>
  <script src="data/legacy-activities.js"></script>
  <script src="data/guide-hierarchy.js"></script>
  <script src="data/exams/domain1-exam-config.js"></script>
  <script src="data/exams/domain1-question-bank.js"></script>
  <script src="data/exam-center/cyu-question-bank.js"></script>
  <script src="data/exam-center/supplemental-approved-question-bank.js"></script>
  <script src="data/reinforcement/domain1-reinforcement.js"></script>
  <script src="data/domain2-addendum.js"></script>
  <script src="data/domains345.js"></script>
  <script src="data/study-hub.js"></script>
  <script src="data/i18n/ui-strings.js"></script>
  <script src="data/i18n/es/domains.js"></script>
  <script src="data/i18n/es/guide-hierarchy.js"></script>
  <script src="data/i18n/es/activities.js"></script>
  <script src="data/i18n/es/enum-values.js"></script>
  <script src="data/i18n/es/addendum-meta.js"></script>
  <script src="data/i18n/es/matrix-tables.js"></script>
  <script src="data/i18n/es/rounds-domain1.js"></script>
  <script src="data/i18n/es/rounds-domain2.js"></script>
  <script src="data/i18n/es/rounds-domain3.js"></script>
  <script src="data/i18n/es/rounds-domain4.js"></script>
  <script src="data/i18n/es/rounds-domain5.js"></script>
  <script src="data/i18n/es/reinforcement.js"></script>
  <script src="data/i18n/es/domain1-question-bank.js"></script>
  <script src="data/i18n/es/cyu-question-bank-d1.js"></script>
  <script src="data/i18n/es/cyu-question-bank-d2.js"></script>
  <script src="data/i18n/es/cyu-question-bank-d3.js"></script>
  <script src="data/i18n/es/cyu-question-bank-d4.js"></script>
  <script src="data/i18n/es/cyu-question-bank-d5.js"></script>
  <script src="data/i18n/es/supplemental.js"></script>
  <script src="data/i18n/apply-locale.js"></script>
  <script src="app.js"></script>
</body>
</html>
